<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#073B3A">
    <title>Offline - Baleta</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/pwa-192.png">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at 20% 10%, rgba(45, 212, 191, .22), transparent 26%), linear-gradient(180deg, #073B3A 0%, #0F766E 48%, #F3EAD7 48%, #FBF7EF 100%); color:#0f172a; display:flex; align-items:flex-end; justify-content:center; padding:24px; }
        .card { width:100%; max-width:420px; background:#fffdfa; border:1px solid rgba(255,255,255,.7); border-radius:32px; padding:24px; box-shadow:0 24px 80px rgba(7,59,58,.26); }
        .icon { width:72px; height:72px; border-radius:24px; background:#073B3A; display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
        img { width:54px; height:54px; }
        h1 { margin:0 0 8px; font-size:26px; line-height:1.1; letter-spacing:-.04em; }
        p { margin:0 0 18px; color:#475569; line-height:1.55; }
        button, a { display:block; width:100%; min-height:52px; border-radius:18px; border:0; background:#0F766E; color:white; font-weight:800; font-size:16px; text-align:center; text-decoration:none; padding:15px 18px; }
        .muted { margin-top:12px; font-size:13px; color:#64748b; text-align:center; }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon"><img src="/icons/pwa-192.png" alt="Baleta"></div>
        <h1>Koneksi sedang offline</h1>
        <p>Aplikasi sudah terpasang, tetapi halaman ini membutuhkan koneksi internet. Periksa jaringan lalu coba muat ulang.</p>
        <button onclick="window.location.reload()">Muat ulang</button>
        <div class="muted">Data yang sudah tersimpan di server tetap aman.</div>
    </main>
</body>
</html>
